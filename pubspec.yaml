name: shiftly
description: "A new Flutter project."
publish_to: 'none'

version: 0.1.8+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  web: ^1.0.0
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: any
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  file_saver: ^0.2.6
  open_filex: ^4.4.0
  shared_preferences: 2.2.3
  uuid: ^4.4.0
  collection: ^1.18.0
  table_calendar: ^3.1.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  http: ^1.2.1
  google_sign_in_all_platforms: ^2.0.3
  googleapis: ^14.0.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.10.0
  firebase_crashlytics: ^4.3.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dependency_overrides:
  path_provider_android: 2.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1E293B"
    theme_color: "#38BDF8"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1E293B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
