name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Android APK
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
          cp build/app/outputs/flutter-apk/*.apk .
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: |
            *.apk

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Web
        run: flutter build web --release
      - name: Archive Web
        run: |
          cd build/web
          zip -r ../../web-release.zip .
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web-release.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Windows
        run: flutter build windows --release
      - name: Archive Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: windows-release.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Linux
        run: flutter build linux --release
      - name: Archive Linux
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../linux-release.zip *
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: linux-release.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build macOS
        run: flutter build macos --release
      - name: Archive macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../macos-release.zip Shiftly.app
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: macos-release.zip

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build iOS (No Sign)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/app/outputs/symbols
      - name: Create iOS Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ios-release.ipa Payload
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-assets
          path: ios-release.ipa

  create-release:
    name: Create GitHub Release
    needs: [ build-android, build-web, build-windows, build-linux, build-macos, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Shiftly Release

            <div dir="rtl">

            ### 📱 הנחיות להתקנה:

            #### Android (קבצי APK מוקטנים):
            * **`app-arm64-v8a-release.apk` (מומלץ למכשירים מודרניים):** הקובץ הקל והמהיר ביותר למכשירים ב-64-bit.
            * **`app-armeabi-v7a-release.apk`:** קובץ מוקטן למכשירי אנדרואיד ישנים (32-bit).
            * **`app-x86_64-release.apk`:** עבור אמולטורים או מכשירי Intel.
            * **`app-release.apk`:** קובץ אוניברסלי הכולל את כל ארכיטקטורות המעבדים.

            #### iOS / iPhone:
            * **`ios-release.ipa`:** קובץ להתקנה ב-iOS. *שימו לב: הקובץ נבנה ללא חתימת מפתח (Unsigned), וניתן להתקנה באמצעות AltStore, TrollStore, Sideloadly או כלי פיתוח.*

            #### Desktop & Web:
            * יש להוריד את קובץ ה-Zip המתאים לפלטפורמה (`windows`, `macos`, `linux`, `web`), לחלץ ולהריץ.

            </div>

          files: |
            release-assets/*.apk
            release-assets/web-release.zip
            release-assets/windows-release.zip
            release-assets/linux-release.zip
            release-assets/macos-release.zip
            release-assets/ios-release.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
