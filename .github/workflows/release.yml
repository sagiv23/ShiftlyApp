name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Android APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
          cp build/app/outputs/flutter-apk/*.apk .
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: |
            *.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Windows
        run: flutter build windows --release
      - name: Archive Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: windows-release.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build macOS
        run: flutter build macos --release
      - name: Archive macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../macos-release.zip Shiftly.app
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: macos-release.zip

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build iOS (No Sign)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/app/outputs/symbols
      - name: Create iOS Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ios-release.ipa Payload
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-assets
          path: ios-release.ipa

  create-release:
    name: Create GitHub Release
    needs: [ build-android, build-windows, build-macos, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Shiftly Release

            <div dir="rtl">

            ### גרסה חדשה למערכת Shiftly

            קבצי ההתקנה הזמינים להורדה:
            * **Android APK** - התקנה ישירה למכשירי אנדרואיד.
            * **Windows** - קובץ ZIP למחשבי Windows.
            * **macOS** - קובץ ZIP למחשבי Mac.
            * **iOS** - קובץ IPA (להתקנה מתקדמת).

            </div>

          files: |
            release-assets/*.apk
            release-assets/windows-release.zip
            release-assets/macos-release.zip
            release-assets/ios-release.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
