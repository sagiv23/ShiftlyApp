name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Configure the four Android signing secrets before creating a release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shiftly-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/shiftly-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build Android APK
        run: |
          flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER" --obfuscate --split-debug-info=build/app/outputs/symbols
          cp build/app/outputs/flutter-apk/*.apk .
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: |
            *.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build Windows
        run: flutter build windows --release --build-name="$($env:GITHUB_REF_NAME.TrimStart('v'))" --build-number="$env:GITHUB_RUN_NUMBER"
      - name: Build Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          $VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          iscc /DAppVersion="$VERSION" windows/installer.iss
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: build/windows/Shiftly_Windows_Setup.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build macOS
        run: flutter build macos --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER"
      - name: Create macOS DMG & ZIP
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname "Shiftly" -srcfolder Shiftly.app -ov -format UDZO Shiftly_macOS.dmg
          zip -r Shiftly_macOS.zip Shiftly.app
          mv Shiftly_macOS.dmg ../../../../../Shiftly_macOS.dmg
          mv Shiftly_macOS.zip ../../../../../Shiftly_macOS.zip
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            Shiftly_macOS.dmg
            Shiftly_macOS.zip

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build iOS (No Sign)
        run: flutter build ios --release --no-codesign --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER" --obfuscate --split-debug-info=build/app/outputs/symbols
      - name: Create iOS Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ios-release.ipa Payload
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-assets
          path: ios-release.ipa

  create-release:
    name: Create GitHub Release
    needs: [ build-android, build-windows, build-macos, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            # Shiftly Release
            <div dir="rtl">
            * **Windows Setup (.exe)** - קובץ התקנה ישיר למחשבי Windows.
            * **macOS DMG / ZIP** - קובץ התקנה (DMG) ו-ZIP למחשבי Mac.
            * **Android APK** - התקנה ישירה למכשירי אנדרואיד.
            * **iOS IPA** - קובץ IPA לא חתום; נדרשת חתימה עם חשבון Apple Developer כדי להתקין.
            </div>
          files: |
            release-assets/*.apk
            release-assets/Shiftly_Windows_Setup.exe
            release-assets/Shiftly_macOS.dmg
            release-assets/Shiftly_macOS.zip
            release-assets/ios-release.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
